# Free/demo deployment. The production-grade topology remains in render.yaml.
# API and relayer share one web service so an incoming API request wakes both
# processes after Render's free-instance idle spin-down.
envVarGroups:
  - name: paymap-demo-secrets
    envVars:
      - key: WEBHOOK_ENCRYPTION_KEY
        generateValue: true
      - key: AUTHORIZATION_ENCRYPTION_KEY
        generateValue: true
      - key: API_KEY_HASH_SECRET
        generateValue: true

services:
  - type: web
    name: paymap-demo-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node scripts/start-render-free.mjs
    preDeployCommand: pnpm prisma:migrate:deploy
    autoDeployTrigger: checksPass
    healthCheckPath: /readyz
    maxShutdownDelaySeconds: 120
    envVars:
      - fromGroup: paymap-demo-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: paymap-demo-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: paymap-demo-keyvalue
          property: connectionString
      - key: STELLAR_NETWORK
        value: testnet
      - key: SOROBAN_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: HORIZON_URL
        value: https://horizon-testnet.stellar.org
      - key: MANDATE_CONTRACT_ID
        value: CCK2CG2DOZ7II4DTTNABU54F3OFMMJRKNABXLPTWINKXPWNMS2Q3XR22
      - key: RELAYER_SECRET_KEY
        sync: false

  - type: keyvalue
    name: paymap-demo-keyvalue
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

databases:
  - name: paymap-demo-postgres
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: paymap_demo
    user: paymap_demo
    ipAllowList: []
