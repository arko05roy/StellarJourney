global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["paymap-alertmanager-staging:9093"]

scrape_configs:
  - job_name: paymap-api
    metrics_path: /metrics
    static_configs:
      - targets: ["paymap-api-staging:10000"]

  - job_name: paymap-relayer
    metrics_path: /metrics
    static_configs:
      - targets: ["paymap-relayer-staging:10000"]
